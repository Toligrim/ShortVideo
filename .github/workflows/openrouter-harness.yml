name: OpenRouter harness checks

on:
  pull_request:
    paths:
      - 'tools/openrouter_*.py'
      - 'tools/run_episode*.sh'
      - 'tools/producer_openrouter_once.py'
      - 'tools/delegate_policy.json'
      - 'tools/test_openrouter_harness.py'
      - 'tools/test_run_episode_runner.py'
      - 'requirements-openrouter.txt'
      - '.github/workflows/openrouter-harness.yml'
  workflow_dispatch:

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest -r requirements-openrouter.txt
      - name: Compile Python harness
        run: |
          python -m py_compile \
            tools/openrouter_base.py \
            tools/openrouter_client.py \
            tools/openrouter_config.py \
            tools/openrouter_control.py \
            tools/openrouter_doctor.py \
            tools/openrouter_executor.py \
            tools/openrouter_agent.py \
            tools/openrouter_harness.py \
            tools/openrouter_sandbox.py \
            tools/openrouter_tools.py \
            tools/openrouter_web.py \
            tools/producer_openrouter_once.py
      - name: Parse shell entrypoints
        run: |
          bash -n tools/run_episode.sh
          bash -n tools/run_episode_legacy.sh
          bash -n tools/run_episode_openrouter.sh
      - name: Run focused regression tests
        run: |
          pytest -q tools/test_openrouter_harness.py tools/test_run_episode_runner.py
